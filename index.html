<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最后一投 · 篮球挑战</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101d29;color:#eef3f7;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:36px;margin:4px 0}p{color:#acbbc9}small,.eyebrow{color:#ffad55;letter-spacing:3px}.stats{display:flex;gap:28px;text-align:center;flex-shrink:0}.stats span{white-space:nowrap}.stats strong{display:block;font-size:36px}.stats span{font-size:13px;color:#acbbc9}.court{position:relative;border:1px solid #405366;border-radius:18px;overflow:hidden;margin:24px 0;background:#223545}canvas{display:block;width:100%;aspect-ratio:1000/520}.message{position:absolute;top:20px;left:0;right:0;text-align:center;font-size:20px;font-weight:700;color:#fff;pointer-events:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;background:#1b2b3a;padding:24px;border-radius:18px}label{display:block;color:#c4d0dc;margin-bottom:12px}input[type=range]{width:100%;accent-color:#ff9f43}button{border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:#30465a;color:#fff}button.active{background:#ffad55;color:#14202c}.shoot{background:#ffad55;color:#14202c;width:100%;margin-top:16px}.restart{width:100%;margin-top:10px}button:disabled{opacity:.45;cursor:default}.hint{font-size:13px;margin-bottom:0}.mode{display:flex;gap:8px}.mode button{flex:1}footer{display:flex;justify-content:space-between;font-size:13px;color:#8fa4b6;margin-top:18px}@media(max-width:650px){header{align-items:flex-start}h1{font-size:26px}header p{font-size:14px}.stats{gap:16px}.stats strong{font-size:27px}.controls{grid-template-columns:1fr;padding:18px;gap:12px}main{padding:18px 12px}footer{display:block}canvas{aspect-ratio:1000/600}}
</style></head>
<body><main><header><div><div class="eyebrow">60 SECOND CHALLENGE</div><h1>最后一投<span style="color:#ffad55">.</span></h1><p>找到你的弧线，让每一次出手都算数。</p></div><div class="stats"><div><strong id="score">0</strong><span>得分</span></div><div><strong id="time">60</strong><span>剩余秒数</span></div></div></header>
<div class="court"><canvas id="court" width="1000" height="520" aria-label="篮球场、球员、篮筐和投篮轨迹"></canvas><div class="message" id="message" role="status">调整角度和力道，准备出手</div></div>
<section class="controls"><div><label for="angle">投篮角度 <b id="angleValue">52°</b></label><input id="angle" type="range" min="25" max="80" value="52"><p class="hint">虚线显示预计飞行路线</p></div><div><label for="power">投篮力道 <b id="powerValue">55%</b></label><input id="power" type="range" min="25" max="100" value="55"><p class="hint">两分推荐 52° / 55%，三分推荐 52° / 68%</p></div><div><div class="mode"><button id="two" class="active" aria-pressed="true">两分球</button><button id="three" aria-pressed="false">三分球</button></div><button id="shoot" class="shoot">投篮 ↗ <span style="font-size:12px">SPACE</span></button><button id="restart" class="restart">重新开始</button></div></section><footer><span>首次投篮开始计时 · 空格键投篮 · R 键重新开始</span><span id="record">命中 0 / 出手 0</span><span>版本 2026.10.12.3</span></footer></main>
<script src="game.js?v=20261012-3"></script></body></html>
